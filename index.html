<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>FITPRO — Mon Programme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0A0A0A" id="themeColor"/>
</head>
<body class="dark">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <span class="app-logo">FITPRO</span>
      <span class="header-date" id="headerDate"></span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Changer thème">
      <span class="icon-sun">☀️</span>
      <span class="icon-moon">🌙</span>
    </button>
  </header>

  <!-- TIMER OVERLAY -->
  <div class="timer-overlay" id="timerOverlay" style="display:none">
    <div class="timer-card">
      <p class="timer-label" id="timerLabel">Repos</p>
      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="52"/>
          <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"/>
        </svg>
        <span class="timer-display" id="timerDisplay">0:00</span>
      </div>
      <p class="timer-next" id="timerNext"></p>
      <div class="timer-actions">
        <button class="timer-btn-skip" onclick="skipTimer()">Passer</button>
        <button class="timer-btn-pause" id="timerPauseBtn" onclick="pauseTimer()">Pause</button>
      </div>
    </div>
  </div>

  <!-- NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="today" onclick="showPage('today')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Aujourd'hui</span>
    </button>
    <button class="nav-btn" data-page="week" onclick="showPage('week')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3z"/><path d="M14 3h7v7h-7z"/><path d="M3 14h7v7H3z"/><path d="M14 14h7v7h-7z"/></svg>
      <span>Semaine</span>
    </button>


  </nav>

  <!-- PAGES -->
  <main class="page-container">

    <!-- PAGE TODAY -->
    <div class="page active" id="page-today">
      <div class="day-hero" id="dayHero">
        <div class="day-badge" id="dayBadge">LUNDI</div>
        <h1 class="day-title" id="dayTitle">Push</h1>
        <p class="day-subtitle" id="daySubtitle">Pecto · Épaules · Triceps</p>
        <div class="day-meta">
          <span class="meta-pill">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="dayDuration">~55 min</span>
          </span>
          <span class="meta-pill" id="progressPill">0% complété</span>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
      </div>
      <div class="session-content" id="sessionContent"></div>
      <div class="reset-wrap">
        <button class="reset-btn" onclick="resetDay()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
          Réinitialiser la séance
        </button>
      </div>
      <div class="app-footer">
        <span class="app-version">v5.0</span>
        <span class="app-sep">·</span>
        <span class="app-copyright">© 2025 RémiRodriguez</span>
      </div>
    </div>

    <!-- PAGE WEEK -->
    <div class="page" id="page-week">
      <div class="page-header">
        <h2 class="page-h2">Semaine</h2>
        <p class="page-desc">Lundi → Vendredi · 16h</p>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </div></main>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[FITPRO] SW enregistré :', reg.scope))
          .catch(err => console.warn('[FITPRO] SW échec :', err));
      });
    }

    // Offline / online banner
    function updateOnlineStatus() {
      let banner = document.getElementById('offlineBanner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'offlineBanner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;padding:8px 16px;text-align:center;font-family:var(--font-body);font-size:12px;font-weight:500;letter-spacing:.5px;transition:transform .3s ease;';
        document.body.appendChild(banner);
      }
      if (!navigator.onLine) {
        banner.textContent = '📵 Hors-ligne — toutes tes données sont disponibles';
        banner.style.background = '#1A1A1A';
        banner.style.color = '#E8FF47';
        banner.style.borderBottom = '1px solid rgba(232,255,71,0.2)';
        banner.style.transform = 'translateY(0)';
      } else {
        banner.textContent = '✅ Connexion rétablie';
        banner.style.background = '#065F46';
        banner.style.color = '#6EE7B7';
        banner.style.borderBottom = '1px solid rgba(110,231,183,0.2)';
        banner.style.transform = 'translateY(0)';
        setTimeout(() => { banner.style.transform = 'translateY(-100%)'; }, 2500);
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    if (!navigator.onLine) updateOnlineStatus();
  </script>
</body>
</html>
